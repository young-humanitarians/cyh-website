term: Humanitarian culture
summary: Where the word comes from, and why rules alone are not enough.
body:
  - >-
    The word *humanitarian* comes from the Latin *humanitas* — the quality of being human,
    expressed through concern for others. In armed conflict, we codified this concern into
    rules: the Geneva Conventions. But rules alone cannot hold a society humane. What holds
    is a humanitarian culture.
